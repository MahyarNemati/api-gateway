name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - name: Unit and integration tests
        run: cargo test --all
      # The shipped example must stay loadable: unknown fields are rejected, so
      # any config change that renames a field breaks it, and the gateway's own
      # --check is the cheapest possible regression test for that.
      - name: Validate the example configuration
        run: cargo run -- --config gateway.example.yaml --check

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # A gateway that terminates auth is exactly where a known-vulnerable
      # dependency matters most. Two transitive advisories are ignored with a
      # written analysis in .cargo/audit.toml; everything else, including the
      # unmaintained class, fails the build.
      - run: cargo audit --deny warnings

  docker:
    name: image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: api-gateway:ci
      - name: Config check inside the image
        run: |
          docker run --rm -v "$PWD/gateway.example.yaml:/etc/gateway.yaml:ro" \
            api-gateway:ci --config /etc/gateway.yaml --check
