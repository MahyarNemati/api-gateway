[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
arc-swap = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fastrand = "2"
http = "1"
http-body-util = "0.1"
humantime-serde = "1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
notify = "8"
pin-project-lite = "0.2"
prometheus = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
criterion = { version = "0.8", features = ["async_tokio"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "alloc"] }
tempfile = "3"
